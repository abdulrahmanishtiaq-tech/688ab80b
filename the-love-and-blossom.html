<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
<meta name="theme-color" content="#120A10">
<title>Eesha &amp; Abdurrahman — Wedding Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&family=Amiri:wght@400;700&family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap">
<style>
/* =====================================================================
   1. TOKENS — 1u = 1% of the stage width
   ===================================================================== */
:root{
  --plum:#4A1A3C; --plum-soft:#74406A;
  --gold:#B8924A; --gold-soft:#E5CF9A;
  --cream:#EADCB9; --cream-hi:#F4EBD3;

  --display:"Cormorant Garamond","Bodoni Moda",Georgia,serif;
  --script:"Allura","Great Vibes","Snell Roundhand",cursive;
  --script-2:"Pinyon Script","Allura",cursive;
  --arabic:"Amiri","Noto Naskh Arabic",serif;
  --urdu:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Amiri",serif;

  --ease-lux:cubic-bezier(.77,0,.175,1);
  --ease-soft:cubic-bezier(.22,.8,.2,1);

  --W:min(100vw, calc(100vh * 1438 / 2576));
  --u:calc(var(--W) / 100);

  /* the beige writing area of scroll-base.jpg, in % of the stage */
  --text-left:26.2%; --text-top:30.7%; --text-w:47.0%; --text-h:41.0%;
  /* the full beige clearing (inside the lace border) of scroll-base.jpg */
  --clear-left:25.6%; --clear-top:25.1%; --clear-w:48.6%; --clear-h:48.7%;
  /* the wax seal inside the intro video / poster */
  --seal-x:50%; --seal-y:49.8%; --seal-d:29;

  color-scheme:light;
}
@supports (height:100dvh){
  :root{ --W:min(100vw, calc(100dvh * 1438 / 2576)); }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;min-height:100svh}
body{
  background:#120A10 radial-gradient(ellipse at 50% 38%, #3A1730 0%, #24101F 52%, #120A10 100%);
  color:var(--plum); font-family:var(--display); overflow:hidden; overscroll-behavior:none;
  display:grid; place-items:center; width:100%; height:100dvh;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
[hidden]{display:none!important}
img{display:block;max-width:100%;user-select:none;-webkit-user-drag:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* =====================================================================
   2. STAGE + LAYERS
   z1 card · z5 video · z6 intro UI · z8 intro hit · z20 controls
   ===================================================================== */
.stage{
  position:relative; width:var(--W); height:calc(var(--W) * 2576 / 1438);
  overflow:hidden; background:#2A1220; isolation:isolate;
  opacity:0; transition:opacity 1s ease;
  user-select:none; -webkit-user-select:none;
  box-shadow:0 calc(var(--u)*2) calc(var(--u)*8) rgba(0,0,0,.6);
}
.stage.is-ready{opacity:1}

.scroll-base{position:absolute;inset:0;z-index:0;width:100%;height:100%;object-fit:cover}

/* ---------- the card / deck ---------- */
.card{position:absolute;inset:0;z-index:1;overflow:hidden;isolation:isolate}
.deck{
  position:absolute; z-index:3;
  left:var(--text-left); top:var(--text-top); width:var(--text-w); height:var(--text-h);
  overflow:hidden; opacity:0; transform:scale(.97); transform-origin:50% 50%;
  transition:opacity .9s ease, transform 1.4s var(--ease-soft);
  pointer-events:none;
}
.stage.is-deck-in .deck{opacity:1;transform:none}
.stage.is-open .deck{pointer-events:auto}
.track{display:flex;height:100%;width:100%;touch-action:pan-y;will-change:transform;transition:transform .8s var(--ease-soft)}
.track.dragging{transition:none}
.panel{
  flex:0 0 100%; height:100%;
  padding:calc(var(--u)*1.6);
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start; text-align:center;
  gap:calc(var(--u)*var(--pg,.8)*var(--fit,1));
  overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.panel::-webkit-scrollbar{display:none}
.panel>:first-child{margin-top:auto}
.panel>:last-child{margin-bottom:auto}
.track.dragging .panel{transition:none}

/* the light pass — confined to the beige clearing of the scroll */
.sheen{
  position:absolute;z-index:2;pointer-events:none;overflow:hidden;opacity:0;transition:opacity 1.4s ease;
  left:var(--clear-left);top:var(--clear-top);width:var(--clear-w);height:var(--clear-h);
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 7%,#000 93%,transparent 100%),linear-gradient(180deg,transparent 0,#000 6%,#000 94%,transparent 100%);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(90deg,transparent 0,#000 7%,#000 93%,transparent 100%),linear-gradient(180deg,transparent 0,#000 6%,#000 94%,transparent 100%);
  mask-composite:intersect;
}
.stage.is-deck-in .sheen{opacity:1}
.sheen::before{
  content:"";position:absolute;top:-10%;bottom:-10%;left:0;width:55%;
  background:linear-gradient(104deg,rgba(255,250,236,0) 30%,rgba(255,248,228,.42) 50%,rgba(255,250,236,0) 70%);
  mix-blend-mode:soft-light;transform:translate3d(-130%,0,0);will-change:transform;
  animation:sheen 17s ease-in-out 4s infinite;
}
@keyframes sheen{0%,80%{transform:translate3d(-130%,0,0)}100%{transform:translate3d(260%,0,0)}}
.sheen.sweep::before{animation:sheenQuick 1.7s ease-in-out 1 forwards}
@keyframes sheenQuick{from{transform:translate3d(-130%,0,0)}to{transform:translate3d(260%,0,0)}}

/* ---------- intro video ---------- */
.intro-video{
  position:absolute;inset:0;z-index:5;width:100%;height:100%;object-fit:cover;
  background:#2A1220;opacity:1;transition:opacity .9s ease;
}
.stage.is-crossfade .intro-video{opacity:0}

/* ---------- intro UI ---------- */
.intro-ui{position:absolute;inset:0;z-index:6;pointer-events:none}
.seal-glow{
  position:absolute; left:var(--seal-x); top:var(--seal-y);
  width:calc(var(--u) * var(--seal-d)); aspect-ratio:1;
  transform:translate(-50%,-50%); border-radius:50%; overflow:hidden;
  pointer-events:none; mix-blend-mode:screen;
  transition:opacity .6s ease;
}
.seal-halo{
  position:absolute;inset:-2%;border-radius:50%;
  background:radial-gradient(circle at 50% 45%,rgba(255,226,160,.6) 0%,rgba(255,214,140,.2) 46%,rgba(255,214,140,0) 72%);
  opacity:.25;animation:halo 4s ease-in-out infinite;
}
@keyframes halo{0%,100%{opacity:.25}50%{opacity:.5}}
.glow-band{
  position:absolute;left:50%;top:50%;width:200%;height:62%;
  background:linear-gradient(180deg,rgba(255,240,205,0) 22%,rgba(255,243,211,.82) 50%,rgba(255,240,205,0) 78%);
  transform:translate(-50%,-50%) rotate(112deg) translateY(-135%);
  will-change:transform;
  animation:sealSweep 4.8s ease-in-out infinite;
}
@keyframes sealSweep{0%{transform:translate(-50%,-50%) rotate(112deg) translateY(-135%)}70.8%,100%{transform:translate(-50%,-50%) rotate(112deg) translateY(135%)}}
.stage.is-crossfade .seal-glow{opacity:0}
.stage.is-tapped .seal-glow{opacity:0;transition:opacity .45s ease}

.seal-glint{
  position:absolute; left:var(--seal-x); top:var(--seal-y);
  z-index:8; width:calc(var(--u) * 33); aspect-ratio:1;
  transform:translate(-50%,-50%); border-radius:50%;
  opacity:0; pointer-events:none; mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(255,250,232,.92) 0%,rgba(255,244,214,.6) 38%,rgba(255,240,205,0) 70%);
}
.stage.is-glimmer .seal-glint{animation:glint .5s ease-out both}
@keyframes glint{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.9)}
  28%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.05)}
}

.env-hint{
  position:absolute;z-index:6;left:50%;top:70%;transform:translateX(-50%);white-space:nowrap;
  font-weight:600;font-size:max(10px,calc(var(--u)*1.7));letter-spacing:.3em;text-indent:.3em;
  text-transform:uppercase;color:var(--gold-soft);text-shadow:0 1px 8px rgba(18,10,16,.75);
  opacity:0;transition:opacity 1.4s ease 1s;pointer-events:none;
}
.env-names{
  position:absolute;z-index:6;left:50%;top:75.2%;transform:translateX(-50%);white-space:nowrap;
  text-align:center;pointer-events:none;
  font-weight:500;font-size:max(12px,calc(var(--u)*2.3));letter-spacing:.22em;text-indent:.22em;
  color:var(--gold-soft);text-shadow:0 1px 8px rgba(18,10,16,.75);
  opacity:0;transition:opacity 1.4s ease 1.3s;
}
.env-names i{font-family:var(--script-2);font-style:normal;font-size:1.9em;letter-spacing:0;text-indent:0;margin:0 .2em;color:var(--gold)}
.stage.is-ready .env-hint{opacity:.9}
.stage.is-ready .env-names{opacity:.95}
.stage.is-tapped .env-hint{opacity:0;transition:opacity .35s ease}
.stage.is-tapped .env-names{opacity:0;transition:opacity .4s ease}

.intro-hit{position:absolute;inset:0;z-index:8;background:transparent;cursor:pointer}
.intro-hit:focus-visible{outline:none;box-shadow:inset 0 0 0 2px rgba(229,207,154,.7)}
.stage.is-crossfade .intro-hit{pointer-events:none}

.skip{
  position:absolute;z-index:9;left:50%;bottom:calc(var(--u)*7 + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);padding:calc(var(--u)*1.4) calc(var(--u)*2.4);
  font-weight:600;font-size:max(10.5px,calc(var(--u)*1.6));letter-spacing:.24em;text-indent:.24em;
  text-transform:uppercase;color:var(--gold-soft);text-shadow:0 1px 6px rgba(18,10,16,.8);
  border-bottom:1px solid rgba(229,207,154,.45);
}

/* ---------- controls ---------- */
.nav{
  position:absolute;z-index:20;left:50%;bottom:calc(var(--u)*3 + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  display:flex;align-items:center;gap:calc(var(--u)*.8);
  opacity:0;pointer-events:none;transition:opacity 1s ease .3s;
}
.stage.is-open .nav{opacity:1;pointer-events:auto}
.arrow{
  width:calc(var(--u)*5.4);height:calc(var(--u)*5.4);min-width:30px;min-height:30px;border-radius:50%;
  border:1px solid rgba(74,26,60,.4);background:rgba(244,235,211,.9);
  display:grid;place-items:center;transition:opacity .3s,background .3s,transform .3s;
  box-shadow:0 2px 8px rgba(10,4,8,.3);
}
.arrow::before{content:"";width:calc(var(--u)*1.5);height:calc(var(--u)*1.5);border-top:1.6px solid var(--plum);border-left:1.6px solid var(--plum);transform:rotate(-45deg);margin-left:calc(var(--u)*.45)}
.arrow.next::before{transform:rotate(135deg);margin-left:calc(var(--u)*-.45)}
.arrow:hover{background:var(--cream-hi)}
.arrow[disabled]{opacity:.3;cursor:default}
.dots{display:flex;gap:calc(var(--u)*.1);align-items:center}
.dot{width:calc(var(--u)*2.6);height:calc(var(--u)*5);min-width:14px;min-height:26px;display:grid;place-items:center}
.dot i{display:block;width:calc(var(--u)*1.1);height:calc(var(--u)*1.1);transform:rotate(45deg);border:1px solid rgba(74,26,60,.55);background:rgba(244,235,211,.55);transition:all .4s ease}
.dot[aria-current="true"] i{background:var(--plum);border-color:var(--plum);transform:rotate(45deg) scale(1.5)}

.sound{
  position:absolute;z-index:20;top:calc(var(--u)*3 + env(safe-area-inset-top,0px));left:calc(var(--u)*3);
  width:calc(var(--u)*7.4);height:calc(var(--u)*7.4);min-width:38px;min-height:38px;border-radius:50%;
  border:1px solid rgba(74,26,60,.35);background:rgba(244,235,211,.92);
  display:grid;place-items:center;box-shadow:0 2px 8px rgba(10,4,8,.3);
  opacity:0;pointer-events:none;transition:opacity .9s ease .5s;
}
.stage.is-open .sound{opacity:1;pointer-events:auto}
.sound svg{width:52%;height:52%;fill:none;stroke:var(--plum);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sound .off{display:none}
.sound[aria-pressed="false"] .on-w{display:none}
.sound[aria-pressed="false"] .off{display:block}

.toast{
  position:absolute;z-index:40;left:50%;top:calc(var(--u)*13);transform:translate(-50%,-10px);
  max-width:calc(var(--u)*72);background:var(--cream-hi);border:1px solid var(--gold);color:var(--plum);
  padding:calc(var(--u)*2) calc(var(--u)*3);font-size:max(12px,calc(var(--u)*2.4));line-height:1.35;
  text-align:center;opacity:0;pointer-events:none;transition:opacity .4s,transform .4s;
  box-shadow:0 calc(var(--u)*1) calc(var(--u)*3) rgba(18,10,16,.35);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* =====================================================================
   3. TYPOGRAPHY — every size rides --fit
   ===================================================================== */
.reveal{opacity:0;transform:translateY(calc(var(--u)*1.2*var(--fit,1)))}
.panel.is-active .reveal{animation:rise .95s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i,0) * 70ms + 100ms)}
@keyframes rise{to{opacity:1;transform:none}}

.kicker{font-style:italic;font-weight:500;font-size:max(11px,calc(var(--u)*2.7*var(--fit,1)));line-height:1.12;color:var(--plum);text-wrap:balance}
.names{display:flex;flex-direction:column;align-items:center;color:var(--plum);line-height:1}
.names .nm{font-weight:400;font-size:max(18px,calc(var(--u)*5.2*var(--fit,1)));line-height:1.02;white-space:nowrap;letter-spacing:0;text-indent:0}
.names .nm1{font-family:var(--script);font-size:max(27px,calc(var(--u)*8*var(--fit,1)));line-height:.95}
.names .nm2{font-family:var(--script-2);font-size:max(23px,calc(var(--u)*6.7*var(--fit,1)));line-height:1.1}
.names .amp{font-family:var(--script-2);font-weight:400;font-size:max(16px,calc(var(--u)*3.9*var(--fit,1)));color:var(--gold);line-height:.85;margin:calc(var(--u)*.1*var(--fit,1)) 0}
.body-text{font-weight:500;font-size:max(9.5px,calc(var(--u)*2.1*var(--fit,1)));line-height:1.32;color:var(--plum);text-wrap:balance}
.panel.is-active .names{animation:namesIn 1.9s cubic-bezier(.22,.8,.2,1) .32s forwards}
@keyframes namesIn{0%{opacity:0;transform:translateY(calc(var(--u)*1.8*var(--fit,1))) scale(.96)}55%{opacity:1}100%{opacity:1;transform:none}}

.w-bism{width:calc(var(--u)*46*var(--fit,1));max-width:94%;height:auto;flex:none}
.w-frame{
  flex:none;width:calc(var(--u)*32*var(--fit,1));max-width:100%;
  aspect-ratio:996/1578;
}
.w-art{width:100%;height:100%;object-fit:contain;object-position:50% 50%;display:block}
.swipe-cue{display:flex;align-items:center;justify-content:center;color:var(--gold);line-height:0}
.swipe-cue svg{width:calc(var(--u)*10*var(--fit,1));height:auto;animation:cue 2.6s ease-in-out infinite}
.swipe-cue path{fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
@keyframes cue{0%,100%{transform:translateX(0);opacity:.55}50%{transform:translateX(calc(var(--u)*1.3));opacity:1}}
.panel-welcome{--pg:.46}

/* dividers: image when present, gold SVG otherwise */
.dv{display:block;width:calc(var(--u)*var(--dw,40)*var(--fit,1));max-width:100%;flex:none;line-height:0}
.dv-img{width:100%;height:auto;opacity:0;transition:opacity .4s ease}
.dv.loaded .dv-img{opacity:1}
.dv.loaded .dv-svg{display:none}
.dv.failed .dv-img{display:none}
.dv-svg{display:block;width:100%;height:calc(var(--u)*2.2*var(--fit,1));color:var(--gold)}

/* event pages */
.panel-event{--pg:.85}
.title{font-weight:500;font-size:max(15px,calc(var(--u)*4.2*var(--fit,1)));line-height:1.08;letter-spacing:.08em;text-indent:.08em;text-transform:uppercase;color:var(--plum);text-wrap:balance}
.event-art{flex:none;width:auto;height:auto;max-height:calc(var(--u)*30*var(--fit,1));max-width:100%;object-fit:contain}
.couple{font-family:var(--script);font-weight:400;font-size:max(14px,calc(var(--u)*3.4*var(--fit,1)));color:var(--plum-soft);line-height:1.15;padding:0 calc(var(--u)*1)}
.date{font-weight:600;font-size:max(10px,calc(var(--u)*2.4*var(--fit,1)));letter-spacing:.12em;text-indent:.12em;text-transform:uppercase;line-height:1.25;color:var(--plum);text-wrap:balance}
.time{font-weight:500;font-size:max(9px,calc(var(--u)*1.9*var(--fit,1)));letter-spacing:.16em;text-indent:.16em;color:var(--plum-soft)}
.kv{display:flex;flex-direction:column;gap:calc(var(--u)*.25*var(--fit,1));align-items:center}
.kv .k{font-weight:600;font-size:max(8.5px,calc(var(--u)*1.3*var(--fit,1)));letter-spacing:.22em;text-indent:.22em;text-transform:uppercase;color:var(--plum-soft)}
.kv .v{font-weight:500;font-size:max(9.5px,calc(var(--u)*1.9*var(--fit,1)));line-height:1.3;color:var(--plum);text-wrap:balance}
.actions{display:flex;gap:calc(var(--u)*2.6*var(--fit,1));align-items:center;justify-content:center;flex-wrap:wrap}
.link-btn{
  font-weight:600;font-size:max(8.5px,calc(var(--u)*1.1*var(--fit,1)));letter-spacing:.2em;text-indent:.2em;
  text-transform:uppercase;color:var(--plum);text-decoration:none;
  padding:calc(var(--u)*.9) calc(var(--u)*.5);border-bottom:1px solid var(--gold);
  transition:border-color .3s,color .3s;
}
.link-btn:hover{color:var(--plum-soft);border-color:var(--plum)}

/* countdown page */
.panel-count{--pg:1.3}
.title-sm{font-weight:500;font-size:max(13px,calc(var(--u)*3.4*var(--fit,1)));line-height:1.1;letter-spacing:.08em;text-indent:.08em;text-transform:uppercase;color:var(--plum);text-wrap:balance}
.next{display:flex;flex-direction:column;gap:calc(var(--u)*.4*var(--fit,1))}
.next b{font-weight:600;font-size:max(9.5px,calc(var(--u)*2.2*var(--fit,1)));color:var(--plum-soft);line-height:1.15;letter-spacing:.04em}
.next span{font-size:max(8.5px,calc(var(--u)*1.7*var(--fit,1)));letter-spacing:.05em;color:var(--plum)}
.countdown{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:calc(100% + var(--u)*1.6);margin-inline:calc(var(--u)*-.8);font-variant-numeric:tabular-nums}
.cd{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*.35*var(--fit,1));position:relative}
.cd+.cd::before{content:"";position:absolute;left:0;top:12%;bottom:12%;width:1px;background:linear-gradient(transparent,var(--gold),transparent)}
.cd strong{font-weight:500;font-size:max(17px,calc(var(--u)*4.6*var(--fit,1)));line-height:1;color:var(--plum)}
.cd small{font-weight:600;font-size:max(8.5px,calc(var(--u)*1.2*var(--fit,1)));letter-spacing:0;text-indent:0;text-transform:uppercase;color:var(--plum-soft);white-space:nowrap}
.finished{font-style:italic;font-size:max(10px,calc(var(--u)*2.1*var(--fit,1)));line-height:1.3;color:var(--plum);padding:calc(var(--u)*1.5) 0;text-wrap:balance}
.h-sm{font-weight:500;font-size:max(12px,calc(var(--u)*3*var(--fit,1)));letter-spacing:.1em;text-indent:.1em;text-transform:uppercase;color:var(--plum);line-height:1.1}
.cal-btn{
  width:100%;padding:calc(var(--u)*1.5) calc(var(--u)*1);border:1px solid rgba(74,26,60,.45);
  background:rgba(244,235,211,.62);border-radius:calc(var(--u)*.4);
  font-weight:600;font-size:max(8.5px,calc(var(--u)*1.2*var(--fit,1)));letter-spacing:.2em;text-indent:.2em;
  text-transform:uppercase;color:var(--plum);transition:background .3s,border-color .3s;
}

/* RSVP page */
.panel-rsvp{--pg:1.2}
.rsvp-title{font-weight:500;font-size:max(15px,calc(var(--u)*4.6*var(--fit,1)));letter-spacing:.3em;text-indent:.3em;color:var(--plum);line-height:1}
.ur{font-family:var(--urdu);color:var(--plum-soft);line-height:1.9;direction:rtl}
.rsvp-ur-t{font-size:max(12px,calc(var(--u)*2.6*var(--fit,1)));font-weight:600}
.rsvp-hint{font-weight:600;font-size:max(8px,calc(var(--u)*1.25*var(--fit,1)));letter-spacing:.24em;text-indent:.24em;text-transform:uppercase;color:var(--plum-soft)}
.rsvp-hint-ur{font-size:max(9.5px,calc(var(--u)*1.9*var(--fit,1)));line-height:1.85}

/* wax seal (page + sheet header) */
.wax{
  position:relative;display:grid;place-items:center;width:calc(var(--u)*22);aspect-ratio:1;flex:none;
  border-radius:47% 53% 49% 51% / 52% 47% 53% 48%;
  background:
    radial-gradient(circle at 32% 26%,rgba(255,255,255,.2),rgba(255,255,255,0) 44%),
    radial-gradient(circle at 50% 52%,#7C3362 0%,#63264D 34%,#4A1A3C 70%,#3A1230 100%);
  box-shadow:
    inset 0 0 0 1px rgba(229,207,154,.22),
    inset 0 calc(var(--u)*.5) calc(var(--u)*1.2) rgba(255,255,255,.14),
    inset 0 calc(var(--u)*-.5) calc(var(--u)*1.4) rgba(0,0,0,.35),
    0 calc(var(--u)*1.1) calc(var(--u)*2) rgba(30,8,20,.42);
  transform:rotate(-2deg);
  animation:sealPulse 4.4s ease-in-out infinite;
}
@keyframes sealPulse{0%,100%{transform:rotate(-2deg) scale(1)}50%{transform:rotate(-2deg) scale(1.025)}}
.wax::before{content:"";position:absolute;inset:10.5%;border-radius:50%;border:1px solid rgba(229,207,154,.5);
  box-shadow:inset 0 1px 2px rgba(255,255,255,.16),inset 0 -1px 2px rgba(0,0,0,.28)}
.wax::after{content:"";position:absolute;inset:20%;border-radius:50%;
  background:radial-gradient(circle at 40% 30%,rgba(255,255,255,.1),transparent 62%)}
.wax .mono{
  position:relative;z-index:1;transform:rotate(2deg);
  font-family:var(--script-2);font-weight:400;font-size:calc(var(--u)*8.6);line-height:1;letter-spacing:0;
  background:linear-gradient(180deg,#F8E9BE 0%,#DCB972 38%,#B8924A 68%,#E5CF9A 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 calc(var(--u)*.15) calc(var(--u)*.3) rgba(0,0,0,.45));
}
.wax-sm{width:calc(var(--u)*9);animation:none}
.wax-sm .mono{font-size:calc(var(--u)*3.5)}
.wax-photo{background:none;box-shadow:none;border-radius:0;width:calc(var(--u)*24)}
.wax-photo::before,.wax-photo::after{content:none}
.wax-photo img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 calc(var(--u)*.7) calc(var(--u)*1.4) rgba(30,8,20,.4))}

/* finale */
.panel-final{--pg:1.1}
.fin-line{font-style:italic;font-weight:500;font-size:max(12px,calc(var(--u)*3.1*var(--fit,1)));line-height:1.2;color:var(--plum);text-wrap:balance}
.fin-love{font-style:italic;font-size:max(10px,calc(var(--u)*2.3*var(--fit,1)));color:var(--plum-soft)}
.fin-names{display:flex;flex-direction:column;align-items:center;color:var(--plum);line-height:1}
.fin-names .sc{font-weight:400;line-height:1.15;padding:0 .2em;white-space:nowrap}
.fin-names .sc1{font-family:var(--script);font-size:max(22px,calc(var(--u)*7*var(--fit,1)))}
.fin-names .sc2{font-family:var(--script-2);font-size:max(18px,calc(var(--u)*5.4*var(--fit,1)))}
.fin-names .amp{font-family:var(--script-2);font-size:max(14px,calc(var(--u)*3.3*var(--fit,1)));color:var(--plum-soft);line-height:.9}
.fin-fam{font-style:italic;font-size:max(10px,calc(var(--u)*2.3*var(--fit,1)));color:var(--plum-soft)}
.replay{
  margin-top:calc(var(--u)*.8*var(--fit,1));padding:calc(var(--u)*1.5) calc(var(--u)*4);
  border:1px solid rgba(74,26,60,.5);border-radius:calc(var(--u)*5);background:rgba(244,235,211,.7);
  font-weight:600;font-size:max(8.5px,calc(var(--u)*1.15*var(--fit,1)));letter-spacing:.24em;text-indent:.24em;
  text-transform:uppercase;color:var(--plum);transition:background .3s;
}
.replay:hover{background:var(--cream-hi)}

/* =====================================================================
   4. RSVP BOTTOM SHEET
   ===================================================================== */
.scrim{position:absolute;inset:0;z-index:24;background:rgba(12,6,10,.52);opacity:0;pointer-events:none;transition:opacity .4s ease}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;z-index:25;left:0;right:0;bottom:0;max-height:90%;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--cream-hi) 0%,var(--cream) 100%);
  color:var(--plum);
  border-radius:calc(var(--u)*5) calc(var(--u)*5) 0 0;
  box-shadow:0 calc(var(--u)*-1.5) calc(var(--u)*4) rgba(18,10,16,.5);
  transform:translate3d(0,101%,0);
  transition:transform .55s var(--ease-soft);
  padding:calc(var(--u)*3) calc(var(--u)*3.4) calc(var(--u)*2.4 + env(safe-area-inset-bottom,0px));
}
.sheet.open{transform:none}
.sheet::before{content:"";position:absolute;left:14%;right:14%;top:calc(var(--u)*1.1);height:1px;background:linear-gradient(90deg,transparent,rgba(184,146,74,.65),transparent)}
.sheet-close{
  position:absolute;z-index:2;top:calc(var(--u)*2);right:calc(var(--u)*2);
  width:calc(var(--u)*5.4);height:calc(var(--u)*5.4);min-width:34px;min-height:34px;border-radius:50%;
  background:rgba(74,26,60,.08);display:grid;place-items:center;
}
.sheet-close svg{width:48%;height:48%;fill:none;stroke:var(--plum);stroke-width:2;stroke-linecap:round}
.sheet-head{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*2.4);padding-bottom:calc(var(--u)*2)}
.sheet-head-txt{display:flex;flex-direction:column;align-items:flex-start;gap:calc(var(--u)*.2)}
.sheet-head-txt .rsvp-title{font-size:calc(var(--u)*4.6);letter-spacing:.26em;text-indent:.26em}
.sheet-head-txt .rsvp-ur-t{font-size:calc(var(--u)*2.2);line-height:1.6}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:calc(var(--u)*.4) calc(var(--u)*.4) calc(var(--u)*1)}
.sheet-body::-webkit-scrollbar{display:none}
.rsvp-form{display:flex;flex-direction:column;gap:calc(var(--u)*1.6);text-align:left}
.f{display:flex;flex-direction:column;gap:calc(var(--u)*.6);min-width:0}
.flab{
  display:flex;justify-content:space-between;align-items:baseline;gap:calc(var(--u)*1);
  font-weight:600;font-size:max(9px,calc(var(--u)*1.3));letter-spacing:.14em;text-transform:uppercase;
  color:var(--plum);line-height:1.25;
}
.flab .ur{font-family:var(--urdu);font-size:max(12px,calc(var(--u)*2.3));letter-spacing:0;text-transform:none;line-height:1.5;font-weight:400}
.flab em{font-style:normal;opacity:.62;letter-spacing:.05em;text-transform:none;font-weight:400}
.in-x{
  width:100%;height:calc(var(--u)*6.4);min-height:44px;border:1px solid rgba(74,26,60,.35);
  background:rgba(244,235,211,.9);border-radius:calc(var(--u)*.7);padding:0 calc(var(--u)*2);
  font-family:var(--display);font-weight:600;font-size:16px;color:var(--plum);outline:none;
  font-variant-numeric:lining-nums tabular-nums;user-select:text;-webkit-user-select:text;
  transition:border-color .25s,box-shadow .25s;-webkit-appearance:none;appearance:none;
}
textarea.in-x{height:calc(var(--u)*10.5);min-height:72px;padding:calc(var(--u)*1.3) calc(var(--u)*2);resize:none;line-height:1.3}
.in-x:focus{border-color:var(--plum);box-shadow:0 0 0 3px rgba(74,26,60,.14)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*1.8)}
.chips{display:grid;gap:calc(var(--u)*1.1)}
.chips.c2{grid-template-columns:1fr 1fr}
.chips.c3{grid-template-columns:repeat(3,1fr)}
.chip{position:relative;display:block;cursor:pointer}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:calc(var(--u)*.15);
  min-height:calc(var(--u)*6.8);padding:calc(var(--u)*.8) calc(var(--u)*.8);
  border:1px solid rgba(74,26,60,.35);border-radius:calc(var(--u)*.7);background:rgba(244,235,211,.8);
  color:var(--plum);transition:all .25s;font-weight:600;font-size:max(12px,calc(var(--u)*2.6));line-height:1.1;
}
.chip small{font-weight:600;font-size:max(8px,calc(var(--u)*1.5));letter-spacing:.1em;text-transform:uppercase;opacity:.72}
.chip input:checked+span{background:linear-gradient(135deg,var(--plum-soft),var(--plum));border-color:var(--plum);color:var(--cream-hi);box-shadow:0 calc(var(--u)*.5) calc(var(--u)*1.2) rgba(74,26,60,.28)}
.chip input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
.send{
  margin-top:calc(var(--u)*.6);height:calc(var(--u)*7.6);min-height:46px;border-radius:calc(var(--u)*5);
  border:1px solid #38122C;background:linear-gradient(135deg,var(--plum-soft),var(--plum) 62%,#38122C);
  color:var(--cream-hi);font-weight:600;font-size:max(10.5px,calc(var(--u)*2));letter-spacing:.28em;text-indent:.28em;
  text-transform:uppercase;box-shadow:0 calc(var(--u)*.7) calc(var(--u)*1.8) rgba(18,10,16,.3);
}

/* debug */
.dbg{display:none;position:absolute;z-index:45;pointer-events:none}
.stage.debug .dbg{display:block}
.dbg-text{left:var(--text-left);top:var(--text-top);width:var(--text-w);height:var(--text-h);outline:1px dashed #19E3FF;box-shadow:inset 0 0 0 1px rgba(25,227,255,.28)}
.dbg-text::after{content:"text area";position:absolute;left:0;top:-14px;font:600 9px/1 monospace;color:#19E3FF;background:rgba(0,0,0,.55);padding:2px 4px}
.dbg-seal{left:var(--seal-x);top:var(--seal-y);width:calc(var(--u)*var(--seal-d));aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;outline:1px dashed #FF58D9}
.dbg-seal::after{content:"seal";position:absolute;left:50%;top:100%;transform:translateX(-50%);font:600 9px/1 monospace;color:#FF58D9;background:rgba(0,0,0,.55);padding:2px 4px}

/* =====================================================================
   5. REDUCED MOTION
   ===================================================================== */
@media (prefers-reduced-motion:reduce){
  .seal-glow{display:none}
  .glow-band,.seal-halo,.sheen::before,.swipe-cue svg,.names,.wax,.seal-glint{animation:none!important}
  .intro-video{transition-duration:.35s}
  .deck{transition-duration:.45s}
  .reveal{opacity:1;transform:none}
  .panel.is-active .reveal{animation:none}
  .track,.panel{transition-duration:.25s}
  .sheet{transition-duration:.25s}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="divider" viewBox="0 0 200 16">
    <path d="M2 8H80M120 8H198" stroke="currentColor" stroke-width="1" fill="none"/>
    <path d="M100 1.5l6.5 6.5-6.5 6.5-6.5-6.5z" fill="currentColor"/>
    <circle cx="86" cy="8" r="1.6" fill="currentColor"/><circle cx="114" cy="8" r="1.6" fill="currentColor"/>
  </symbol>
  <symbol id="ornament" viewBox="0 0 90 36">
    <path d="M45 4c5 5 5 10 0 14-5-4-5-9 0-14zM45 32c-5-5-5-10 0-14 5 4 5 9 0 14zM27 18c6-5 11-5 18 0-7 5-12 5-18 0zM45 18c7-5 12-5 18 0-6 5-11 5-18 0z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="45" cy="18" r="2" fill="currentColor"/>
    <path d="M2 18h20M68 18h20" stroke="currentColor" stroke-width="1"/>
  </symbol>
</svg>

<main class="stage" id="stage" aria-label="Wedding invitation for Eesha and Abdurrahman">

  <div class="card">
    <img class="scroll-base" src="assets/love-blossom/scroll-base.jpg" alt="" decoding="async">
    <div class="deck" id="deck" role="region" aria-roledescription="carousel" aria-label="Wedding celebrations">
      <div class="track" id="track"></div>
    </div>
    <div class="sheen" aria-hidden="true"></div>
  </div>

  <video class="intro-video" id="introVideo" src="assets/love-blossom/intro.mp4" poster="assets/love-blossom/intro-poster.jpg" preload="auto" playsinline webkit-playsinline muted></video>

  <div class="intro-ui" aria-hidden="true">
    <div class="seal-glow"><span class="seal-halo"></span><span class="glow-band"></span></div>
    <p class="env-hint">Tap the seal to open</p>
    <p class="env-names">EESHA<i>&amp;</i>ABDURRAHMAN</p>
  </div>
  <span class="seal-glint" aria-hidden="true"></span>
  <button class="intro-hit" id="introHit" type="button" aria-label="Open the invitation"></button>
  <button class="skip" id="skip" type="button" hidden>Skip</button>

  <button class="sound" id="sound" type="button" aria-pressed="true" aria-label="Mute music" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/>
      <path class="on-w" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>
      <path class="off" d="M16 9.5l5 5M21 9.5l-5 5"/>
    </svg>
  </button>

  <nav class="nav" id="nav" aria-label="Invitation pages">
    <button class="arrow prev" id="prev" type="button" aria-label="Previous page"></button>
    <div class="dots" id="dots"></div>
    <button class="arrow next" id="next" type="button" aria-label="Next page"></button>
  </nav>

  <div class="scrim" id="scrim" aria-hidden="true"></div>
  <p class="sr-only" id="cdLive" aria-live="polite"></p>
  <aside class="sheet" id="rsvpSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true" inert>
    <button class="sheet-close" id="sheetClose" type="button" aria-label="Close RSVP form">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="sheet-head">
      <span class="wax wax-sm" aria-hidden="true"><span class="mono">E&amp;A</span></span>
      <div class="sheet-head-txt">
        <h2 class="rsvp-title" id="sheetTitle">RSVP</h2>
        <p class="ur rsvp-ur-t" lang="ur" dir="rtl">جوابِ دعوت</p>
      </div>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </aside>

  <div class="dbg dbg-text" aria-hidden="true"></div>
  <div class="dbg dbg-seal" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <audio id="music" preload="auto"></audio>
</main>

<script src="the-love-and-blossom.js" defer></script>
</body>
</html>
