<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pricing tests</title>
<style>body{font:16px system-ui;margin:2rem;max-width:800px}li{padding:.35rem}.pass{color:green}.fail{color:red}</style>
</head>
<body><h1>Pricing engine tests</h1><p id="summary"></p><ol id="results"></ol><script src="../config.js"></script><script src="../pricing.js"></script><script>
const C=window.DI.catalog,P=window.DI.pricing,results=document.querySelector('#results');let passed=0,total=0;
function test(name,condition){total++;const li=document.createElement('li');li.className=condition?'pass':'fail';li.textContent=`${condition?'PASS':'FAIL'} — ${name}`;results.append(li);if(condition)passed++}
const quote=s=>P.calculateQuote(s,C),line=(s,t)=>quote(s).lines.find(x=>x.type===t);
test('every template is a flat $8 with no discount',quote({}).totalUSD===8&&quote({}).listTotalUSD===8&&quote({}).discountUSD===0);
test('no discount line is added',line({},'discount')===undefined);
test('all templates quote the same price',C.templates.every(t=>quote({templateId:t.id}).totalUSD===8));
test('PKR shows exactly Rs 2,000',P.formatMoney(quote({}).totalUSD,'PKR',C)==='Rs 2,000');
test('express delivery adds $5 for a $13 total',quote({express:true}).totalUSD===13&&line({express:true},'express').amountUSD===5);
test('PKR express total is Rs 3,250',P.formatMoney(quote({express:true}).totalUSD,'PKR',C)==='Rs 3,250');
test('engine still honours a configured discount',P.calculateQuote({},Object.assign({},C,{discount:{active:true,percent:25,label:'Promo',endsAt:''}})).totalUSD===6);
test('ended discount restores the list price',P.calculateQuote({},Object.assign({},C,{discount:{active:true,percent:25,label:'Promo',endsAt:'2020-01-01'}})).totalUSD===8);
test('template line names The Vow Atelier',line({},'template').label==='Template Invitation: The Vow Atelier');
test('whole amounts have no decimals',P.formatMoney(8,'USD',C)==='$8'&&P.formatMoney(13,'USD',C)==='$13');
document.querySelector('#summary').textContent=`${passed}/${total} tests passed`;
</script></body></html>
